# M-D: full measured C++/OpenMP execution replay. LOCKED before launch; do not edit.
# Analysis plan and acceptance criteria: docs/MD_ANALYSIS_PLAN.md (written before launch).
# Run once:  python -m schedlab.ompexec final --config configs/omp_exec_final.toml
[campaign]
name = "omp_exec_final"
notes = "single run; no automatic rerun; integrity failures are reported, not repaired"

[inputs]
instances_config = "configs/s01_final.toml"     # [workload] + seed shared by all three accepted final campaigns
split = "test_id"                                # 360 paired instances: 4 classes x n {50,100,200} x m {2,4,8} x 10
calibration_dir = "results/raw/20261017T172332Z-omp_calibration-422f7f41"
calibration_manifest = "results/raw/20261017T172332Z-omp_calibration-422f7f41/manifest.json"
rederive_dir = "results/raw/20261017T162329Z-rederive-21e353a7"
rederive_manifest = "results/raw/20261017T162329Z-rederive-21e353a7/manifest.json"

[execution]
reps = 10                       # timed repetitions per (instance, granularity, method)
warmup = 2                      # untimed-for-analysis passes before them (rows kept, warmup = 1)
granularities_us_per_tu = [10.0, 1.0, 0.1]   # mean task 100 sim_tu = 1 ms, 100 us, 10 us
iters_per_tu = { "10.0" = 8130.952789113306, "1.0" = 813.0952789113305, "0.1" = 81.30952789113306 }  # from calibration
modes = ["serial", "static", "tasks"]
static_methods = ["FCFS-EAT", "HEFT", "GA#s0", "GA#s1", "GA#s2", "GA-KEYS-EFT#s0", "GA-KEYS-EFT#s1",
                  "GA-KEYS-EFT#s2", "RL-S0", "RL-S1", "RL-S2", "ADAPTIVE", "TRY-ALL"]
# Execution order (reproducible randomization against drift):
#  instances: numpy default_rng(instance_order_seed).permutation(360)
#  granularities within the k-th instance: default_rng([k, 7]).permutation([10.0, 1.0, 0.1])
#  methods within each pass (2 warm-up + 10 timed passes): default_rng([int(instance_hash[:8], 16),
#    round(g * 1000)]).permutation(15), a fresh permutation per pass
instance_order_seed = 20261017
verified_and_traced = "rep 0 of every (instance, granularity, method)"

[omp]
env = { OMP_DYNAMIC = "false", OMP_MAX_ACTIVE_LEVELS = "1" }
wait_policy = "libgomp default: OMP_WAIT_POLICY and GOMP_SPINCOUNT unset (threads spin, then sleep); unchanged from the pilot"
pinning = "none (macOS ignores OMP_PROC_BIND); threads may run on performance or efficiency cores"

[expected]
instances = 360
rows = 194400          # 360 x 3 granularities x 15 methods x (2 warm-up + 10 timed)
timed_rows = 162000    # 360 x 3 x 15 x 10
verified_rows = 16200  # 360 x 3 x 15 (rep 0)
trace_rows = 1890000   # sum of n over the 360 instances (42,000) x 3 x 15

