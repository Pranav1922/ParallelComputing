# Full campaign. NOT RUN YET. Sections for GA, RL and the selector are added in their milestones.
[campaign]
name = "full"
seed = 20261011
workers = 1
notes = ""

[workload]
sizes = [50, 100, 200]
processors = [2, 4, 8]
classes = ["regular", "irregular", "heterogeneous", "irregular_hetero"]
