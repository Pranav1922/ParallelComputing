# S02 final campaign. LOCKED 2026-10-17 before any test-split evaluation of S02; do not edit (tests/test_rl.py checks it).
# Models: the four full-training policies (docs/S02_PILOT_REPORT.md 9), pinned by id; trained on the train stream,
# checkpoints chosen on val; nothing here is tuned on test data. Primary: RL (= per-instance mean of RL-S0..S2) vs
# HEFT on test_id, Wilcoxon (EXPERIMENTAL_METHODOLOGY 5.1; population fixed in the approved S02 plan). Everything
# else (FCFS-EAT and other heuristics, per-seed, RL-NOHEFTFEAT ablation, test_ood generalization) is secondary.
[campaign]
name = "s02_final"
seed = 20261011
workers = 1
notes = "single worker; power source recorded automatically in the manifest (power_at_start / power_at_end)"

[workload]
sizes = [50, 100, 200]
processors = [2, 4, 8]
classes = ["regular", "irregular", "heterogeneous", "irregular_hetero"]
instances = { train = 30, val = 5, test_id = 10, test_ood = 10 }   # per cell
ood = ["ood_size", "ood_procs", "ood_struct", "ood_cv"]

[run]
splits = ["test_id", "test_ood"]
algorithms = ["FCFS-EAT", "FCFS-EFT", "SPT-EFT", "LPT-EFT", "HEFT", "MINMIN",
              "RL-S0", "RL-S1", "RL-S2", "RL-NOHEFTFEAT"]
timing_repeats = 3
timeout_s = 600

[s02]
models = { "RL-S0" = "results/models/s02_rl_seed0", "RL-S1" = "results/models/s02_rl_seed1", "RL-S2" = "results/models/s02_rl_seed2", "RL-NOHEFTFEAT" = "results/models/s02_rl_noheftfeat_seed0" }
model_ids = { "RL-S0" = "c827a9f51c512ac4", "RL-S1" = "e83496e27b9d4ef1", "RL-S2" = "1765acd48d43dfde", "RL-NOHEFTFEAT" = "a7781d888bca8550" }
